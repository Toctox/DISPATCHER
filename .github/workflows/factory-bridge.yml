name: FactoryBridge

on:
  push:
    branches: [main]
    paths:
      - 'factory_bridge/**'
      - 'scripts/factory-bridge-admin-poller.ps1'
      - 'scripts/factory-bridge-autoupdate.ps1'
      - '.github/workflows/factory-bridge.yml'
  pull_request:
    paths:
      - 'factory_bridge/**'
      - 'scripts/factory-bridge-admin-poller.ps1'
      - 'scripts/factory-bridge-autoupdate.ps1'
      - '.github/workflows/factory-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: factory_bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: factory_bridge/go.sum
      - name: Validate admin PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        working-directory: .
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts\factory-bridge-admin-poller.ps1',
            'scripts\factory-bridge-autoupdate.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "$script parser errors: $messages"
            }
            Write-Host "$script parser=OK"
          }
      - name: Test
        run: go test ./...
      - name: Build Windows executable
        run: go build -trimpath -ldflags "-s -w" -o FactoryBridge.exe .
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Get-Item .\FactoryBridge.exe
          if ($exe.Length -le 0) { throw "FactoryBridge.exe is empty" }
          Write-Host "FactoryBridge.exe bytes=$($exe.Length)"
      - name: Publish Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FactoryBridge-windows-amd64
          path: factory_bridge/FactoryBridge.exe
          if-no-files-found: error
          retention-days: 7
