name: DispatcherPython

on:
  push:
    branches: [main]
    paths:
      - 'factory_dispatcher/**'
      - 'scripts/**'
      - 'tests/test_chatgpt_extension.py'
      - 'tests/test_chatgpt_bridge_resilience.py'
      - 'tests/test_chatgpt_foreground.py'
      - 'tests/test_chatgpt_foreground_v4.py'
      - 'requirements*.txt'
      - '.github/workflows/dispatcher-python.yml'
  pull_request:
    paths:
      - 'factory_dispatcher/**'
      - 'scripts/**'
      - 'tests/test_chatgpt_extension.py'
      - 'tests/test_chatgpt_bridge_resilience.py'
      - 'tests/test_chatgpt_foreground.py'
      - 'tests/test_chatgpt_foreground_v4.py'
      - 'requirements*.txt'
      - '.github/workflows/dispatcher-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extension bridge test dependencies
        run: python -m pip install -r requirements-extension.txt pytest
      - name: Parse dispatcher PowerShell
        shell: pwsh
        run: |
          foreach ($script in @('scripts/run-tick.ps1', 'scripts/chatgpt-focus-composer.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("${script}: " + $_.Message) }
              exit 1
            }
          }
      - name: Extension bridge functional tests
        shell: pwsh
        run: |
          python -m pytest tests/test_chatgpt_extension.py -q -k "not test_manifest_permissions_and_no_remote_control and not test_codex_and_cdp_implementation_files_unchanged"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_chatgpt_bridge_resilience.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Foreground launcher regression tests
        shell: pwsh
        run: |
          python -m pytest tests/test_chatgpt_foreground.py tests/test_chatgpt_foreground_v4.py -q
