name: ExtensionBridge

on:
  push:
    branches: [main]
    paths:
      - 'browser_extension/project_factory_bridge/**'
      - 'tests/*.test.mjs'
      - '.github/workflows/extension-bridge.yml'
  pull_request:
    paths:
      - 'browser_extension/project_factory_bridge/**'
      - 'tests/*.test.mjs'
      - '.github/workflows/extension-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Browser extension regression tests
        run: node --test tests/*.test.mjs
