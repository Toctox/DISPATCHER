[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-dispatcher"
version = "0.1.0"
description = "Dispatcher local e mecanico da PROJECT FACTORY"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.179,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "portalocker>=3.2,<4",
  "pyperclip>=1.9,<2",
]

[project.optional-dependencies]
browser = ["playwright>=1.60,<2"]
extension = ["websockets>=15,<17"]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "websockets>=15,<17"]

[project.scripts]
factory-dispatcher = "factory_dispatcher.cli:main"

[tool.setuptools.packages.find]
include = ["factory_dispatcher*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
